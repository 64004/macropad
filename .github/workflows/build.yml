name: Build Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout custom config
      uses: actions/checkout@v3

    - name: Run QMK Build Action
      uses: qmk/qmk-action@v4
      with:
        playlist: 'vial'
        keyboard: 'handwired/macro3enc'
        keymap: 'default'
