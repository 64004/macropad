name: Build Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout custom config
      uses: actions/checkout@v4
      with:
        path: macro3enc

    - name: Set up QMK CLI and dependencies
      run: |
        sudo msgformat --version || sudo apt-get update && sudo apt-get install -y gettext python3-pip
        python3 -m pip install qmk

    - name: Clone Vial Repository (Lightweight)
      run: |
        git clone --depth 1 --branch vial https://github.com vial
        cd vial
        make git-submodule

    - name: Inject custom keyboard
      run: |
        mkdir -p vial/keyboards/handwired
        mv macro3enc vial/keyboards/handwired/macro3enc

    - name: Compile Firmware
      run: |
        cd vial
        qmk compile -kb handwired/macro3enc -km default

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macro3enc_firmware
        path: vial/.build/*.hex
