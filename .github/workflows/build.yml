name: Build Vial Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout custom config
      uses: actions/checkout@v4
      with:
        path: macro3enc

    - name: Setup QMK firmware environment
      run: |
        mkdir -p keyboards/handwired
        mv macro3enc keyboards/handwired/macro3enc

    - name: Compile inside Vial Docker
      uses: docker://vialkb/vial-qmk:latest
      with:
        args: qmk compile -kb handwired/macro3enc -km default

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macro3enc_firmware
        path: .build/*.hex
